:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#151C27; --surface-2:#1F2836; --ink:#E6ECF5; --ink-2:#98A4B8; --line:#2A3547;
  --accent:#7BA6FF; --on-accent:#0A1B40; --c-volley:#F0A060; --c-friends:#A5B3C4;
  --warn:#E0A04A; --danger:#F0877B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--font-body);
  padding-block:18px 112px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:560px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
h1{font:600 19px/1.2 var(--font-display); letter-spacing:-0.01em; margin:0; text-wrap:balance}
h2{font:600 16px/1.3 var(--font-body); margin:0 0 8px}
p{margin:0}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:14px}
.pill{font-size:12px; color:var(--ink-2); border:1px solid var(--line); border-radius:99px; padding:3px 10px; white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.label{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-weight:500}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:transparent; border-radius:99px; padding:7px 13px; min-height:40px; font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.sm{min-height:36px; padding:5px 12px; font-size:13px}
.chip.ptitle{max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip.own{border-style:dashed; border-color:var(--accent); color:var(--accent); font-weight:500}
.chip.own[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-style:solid}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 14px; min-height:44px; font-weight:500}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.danger{color:var(--danger); border-color:var(--danger); background:transparent}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.4; cursor:default}
.linkbtn{background:none; border:0; padding:6px 0; color:var(--accent); text-decoration:underline; text-underline-offset:3px; min-height:36px}

.hero{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:12px}
.hero h2{font:700 20px/1.2 var(--font-display); letter-spacing:-0.01em; margin:0}
.go{border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); min-height:60px; font:600 17px var(--font-body); width:100%}
.resume{background:var(--surface-2); border-radius:12px; padding:14px; display:grid; gap:10px; margin-bottom:14px}
.week{padding:18px 0 4px; display:grid; gap:10px}
.dots{display:flex; gap:8px}
.dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); background:transparent}
.dot.on{background:var(--accent); border-color:var(--accent)}
.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding-top:14px}
.quick .btn{min-height:52px}
.form{display:grid; gap:12px; padding:14px; margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.form label{display:grid; gap:4px; font-size:13px; color:var(--ink-2)}
.form input[type="text"],.form input:not([type]),.form select,.form textarea{width:100%; min-height:44px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
.form textarea{min-height:76px; resize:vertical}
.hist{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.hist li{display:flex; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line)}
.hist .h-body{flex:1; min-width:0; display:grid; gap:1px}
.hist .h-title{font-weight:500; overflow-wrap:anywhere}
.x{flex:none; min-width:44px; min-height:44px; background:none; border:0; color:var(--ink-2); font-size:13px}
.sec-title{padding:22px 0 8px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden}
.card-head{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:0; padding:14px; text-align:left; min-height:52px}
.card-head .t{font-weight:600; overflow-wrap:anywhere}
.card-head .n{font-variant-numeric:tabular-nums; color:var(--ink-2); font-size:14px; flex:none}
.card.complete .card-head .n{color:var(--accent); font-weight:600}
.card-body{padding:0 14px 14px; display:grid; gap:10px}
.check{display:flex; gap:10px; align-items:flex-start; padding:6px 0; min-height:44px}
.check input{width:22px; height:22px; margin-top:1px; accent-color:var(--accent); flex:none}
.check label{flex:1}
.colhead,.set{display:grid; grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 48px; gap:8px; align-items:center}
.nw .colhead,.nw .set{grid-template-columns:22px minmax(0,1fr) 48px}
.colhead span{font-size:12px; color:var(--ink-2); text-align:center}
.sn{font-size:13px; color:var(--ink-2); text-align:center; font-variant-numeric:tabular-nums}
.step{display:grid; grid-template-columns:36px minmax(0,1fr) 36px; align-items:stretch; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--bg)}
.step button{background:var(--surface-2); border:0; font-size:20px; min-height:44px; padding:0}
.step input,.step .sv{width:100%; min-width:0; border:0; background:transparent; text-align:center; font-weight:600; font-variant-numeric:tabular-nums; padding:0; min-height:44px}
.step .sv{display:flex; align-items:center; justify-content:center}
.set.done .step{opacity:.55}
.ok{min-height:44px; width:48px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:20px; padding:0}
.set.done .ok{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.fb{display:flex; gap:6px; flex-wrap:wrap; padding:0 0 4px 30px; align-items:center}
.fb .small{margin-right:2px}
.tip{font-size:13px; color:var(--ink-2)}
.hint{font-size:13px; color:var(--accent); font-weight:500}
.intro{background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px}

.pitem{padding:12px 0; border-bottom:1px solid var(--line); display:grid; gap:8px}
.pitem:first-of-type{border-top:1px solid var(--line)}
.pname{font-weight:600; min-width:0; overflow-wrap:anywhere}
.pctl{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:center}
.pctl .pair{display:flex; align-items:center; gap:6px}
.pctl .step{flex:1; min-width:0; max-width:150px}
.pbtns{display:flex; gap:0; flex:none}
.pbtns .x{min-width:40px}
.field{width:100%; min-height:44px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink)}
.pcard{padding:14px; display:grid; gap:8px}

.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.bar.go-now{background:var(--accent); color:var(--on-accent)}
.bar-in{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; justify-content:space-between}
.bar-in .tt{font:700 20px var(--font-display); font-variant-numeric:tabular-nums; min-width:0}
.bar-in .tt small{display:block; font:400 12px var(--font-body); opacity:.75}
.tabs-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:2px}
.tabs{padding-left:max(8px, env(safe-area-inset-left, 0px)); padding-right:max(8px, env(safe-area-inset-right, 0px)); padding-top:6px}
.tab{background:none; border:0; border-top:3px solid transparent; min-height:48px; font-size:13px; color:var(--ink-2); font-weight:500; padding:0 2px}
.tab[aria-current="page"]{color:var(--ink); border-top-color:var(--accent); font-weight:600}
.toast{
  position:fixed; z-index:30; left:50%; transform:translateX(-50%);
  bottom:calc(88px + env(safe-area-inset-bottom, 0px));
  max-width:calc(100% - 32px); background:var(--ink); color:var(--bg);
  border-radius:10px; padding:10px 14px; display:flex; gap:14px; align-items:center; font-size:14px;
}
.t-undo{background:none; border:0; color:inherit; font-weight:600; text-decoration:underline; min-height:32px; padding:0}

.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--ink-2); font:11px var(--font-body)}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .goalline{stroke:var(--ink-2); stroke-width:1; stroke-dasharray:4 4}
.chart .line{stroke:var(--accent); stroke-width:2.5; fill:none; stroke-linejoin:round; stroke-linecap:round}
.chart .area{fill:var(--accent); fill-opacity:.12; stroke:none}
.chart .pt{fill:var(--surface); stroke:var(--accent); stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .val{fill:var(--ink); font-weight:600}
.chart .b-gym{fill:var(--accent)}
.chart .b-volley{fill:var(--c-volley)}
.chart .b-friends{fill:var(--c-friends)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--ink-2); padding-top:6px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.stats{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); margin:12px 0}
.stat{padding:12px 0; border-bottom:1px solid var(--line); display:grid; gap:2px}
.stat:nth-child(odd){padding-right:12px}
.stat b{font:700 22px/1.1 var(--font-display); font-variant-numeric:tabular-nums}
select.sel{width:100%; min-height:44px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.tbl{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.tbl li{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.tbl li span:last-child{text-align:right; font-variant-numeric:tabular-nums; min-width:0; overflow-wrap:anywhere}
.section{display:grid; gap:10px; padding:16px 0; border-bottom:1px solid var(--line)}
.section:first-of-type{padding-top:0}
textarea.raw{width:100%; min-height:120px; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--ink)}
.verdict{padding:12px 14px; background:var(--surface-2); border-radius:10px; display:grid; gap:8px}
.empty{padding:14px 0; color:var(--ink-2)}
@media (prefers-reduced-motion: no-preference){ .dot{transition:background .2s} }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Дневник тренировок</h1>
    <span id="sync" class="pill">в браузере</span>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav id="bar" class="bar tabs" aria-label="Разделы"></nav>

<script>
(function(){
'use strict';

var GOAL = 3;
var LS = 'trainDiary.v1', LSA = 'trainDiary.active.v1';
var MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var WD = ['вс','пн','вт','ср','чт','пт','сб'];
var TYPE_NAME = {gym:'Зал', volley:'Волейбол', friends:'Игра с друзьями'};
var INT_LABEL = ['', 'Лёгкая', 'Спокойная', 'Средняя', 'Тяжёлая', 'Очень тяжёлая'];
var RPE_LABEL = ['', 'Очень легко', 'Легко', 'Нормально', 'Тяжело', 'На пределе'];
var PAIN = ['Плечо', 'Колено', 'Спина', 'Голеностоп', 'Другое'];
var FB = {easy:'Легко', ok:'Нормально', hard:'Тяжело'};
var KIND_NAME = {w:'с весом', bw:'повторы без веса', time:'на время'};
var DEF_BY_KIND = {w:{sets:3, reps:[8,10], step:1}, bw:{sets:3, reps:[10,15], step:1}, time:{sets:3, reps:[30,45], step:5}};

/* kind: w = вес и повторы, bw = только повторы, time = секунды */
var EX0 = {
 squat:{name:'Приседания с гантелью у груди', kind:'w', step:1, sets:3, reps:[8,10], tip:'Гантель у груди, спина прямая, колени смотрят туда же, куда носки. Опускайтесь до параллели бёдер с полом.'},
 dbbench:{name:'Жим гантелей лёжа', kind:'w', step:1, sets:3, reps:[8,10], tip:'Лопатки сведены, стопы на полу. Опускайте гантели медленно, до лёгкого растяжения в груди.'},
 pulldown:{name:'Тяга верхнего блока', kind:'w', step:2.5, sets:3, reps:[8,10], tip:'Тяните рукоять к верху груди, не раскачивайтесь корпусом, локти вниз.'},
 rdl:{name:'Румынская тяга', kind:'w', step:1, sets:3, reps:[8,10], tip:'Колени слегка согнуты, таз уходит назад, спина прямая. Гантели скользят вдоль ног.'},
 plank:{name:'Планка', kind:'time', step:5, sets:3, reps:[30,40], tip:'Тело в одну линию от пяток до головы, не прогибайте поясницу. Значение в секундах.'},
 lunge:{name:'Выпады с гантелями', kind:'w', step:1, sets:3, reps:[8,10], tip:'Повторы на каждую ногу. Колено передней ноги не выходит далеко за носок, корпус прямой.'},
 ohp:{name:'Жим гантелей сидя над головой', kind:'w', step:1, sets:3, reps:[8,10], tip:'Не прогибайте поясницу, спина прижата к спинке. Поднимайте гантели ровно над плечами.'},
 dbrow:{name:'Тяга гантели в наклоне', kind:'w', step:1, sets:3, reps:[8,10], tip:'Одна рука и колено на скамье. Тяните локоть к поясу, плечо не поднимайте к уху. Повторы на каждую руку.'},
 bridge:{name:'Ягодичный мостик', kind:'w', step:2.5, sets:3, reps:[8,10], tip:'Можно начать без веса (0). Вверху напрягите ягодицы на секунду, поясницу не прогибайте.'},
 boxjump:{name:'Прыжки на тумбу', kind:'bw', step:1, sets:3, reps:[5,6], tip:'Мягкое приземление на согнутые ноги, затем спуститесь шагом. Тумба невысокая, пока техника не уверенная.'},
 jumpsquat:{name:'Приседания с прыжком', kind:'bw', step:1, sets:3, reps:[6,8], tip:'Присядьте, выпрыгните вверх, приземляйтесь мягко на согнутые ноги.'},
 rope:{name:'Скакалка', kind:'time', step:5, sets:3, reps:[30,45], tip:'Лёгкие прыжки на носках. Значение в секундах.'},
 cuff:{name:'Ротаторная манжета с резинкой', kind:'bw', step:1, sets:2, reps:[12,15], tip:'Локоть прижат к боку, поворачивайте предплечье наружу против сопротивления резинки. Защищает плечо для атакующего удара.'},
 calf:{name:'Подъёмы на носки', kind:'bw', step:1, sets:3, reps:[12,15], tip:'Поднимайтесь максимально высоко, опускайтесь медленно. Укрепляет голеностоп и помогает прыжку.'},
 sideplank:{name:'Боковая планка', kind:'time', step:5, sets:2, reps:[20,30], tip:'Тело в одну линию, таз не проваливается. Значение в секундах на каждую сторону.'},
 pushup:{name:'Отжимания', kind:'bw', step:1, sets:3, reps:[8,12], tip:'Тело прямое, локти под углом около 45° к корпусу. Если тяжело, отжимайтесь от скамьи или с колен.'},
 airsquat:{name:'Приседания без веса', kind:'bw', step:1, sets:3, reps:[12,15], tip:'Стопы на ширине плеч, колени по линии носков, спина прямая.'},
 gluteb:{name:'Ягодичный мостик без веса', kind:'bw', step:1, sets:3, reps:[12,15], tip:'Вверху напрягите ягодицы на секунду, поясницу не прогибайте.'},

 bulgar:{name:'Болгарские выпады с гантелями', kind:'w', step:1, sets:3, reps:[8,8], tip:'Повторы на каждую ногу. Колено не заваливается внутрь.'},
 calf1:{name:'Подъёмы на носок на одной ноге', kind:'bw', step:1, sets:3, reps:[12,12], tip:'Икры напрямую влияют на прыжок. Повторы на каждую ногу.'},
 hollow:{name:'Холлоу-холд', kind:'time', step:5, sets:3, reps:[20,40], tip:'Линия тела для стойки на руках: поясница прижата к полу. Значение в секундах.'},
 medball:{name:'Броски медбола из-за головы в пол', kind:'w', step:1, sets:4, reps:[5,5], tip:'Максимально взрывно, имитация удара. Вес указывайте как вес медбола.'},
 pullup:{name:'Подтягивания', kind:'w', step:2.5, sets:5, reps:[5,8], tip:'Вес указывайте как дополнительный (0 — без веса). Когда получается 5×10, добавляйте вес. В тренировке C — около 60% от максимума, отдых 60–90 с.'},

 legraise:{name:'Подъём ног в висе', kind:'bw', step:1, sets:3, reps:[8,12], tip:'Начните с согнутых коленей.'},
 medrot:{name:'Вращательные броски медбола в стену', kind:'w', step:1, sets:3, reps:[6,6], tip:'Повторы на каждую сторону. Сила корпуса при ударе.'},
 runjump:{name:'Прыжки с волейбольного разбега', kind:'bw', step:1, sets:5, reps:[3,3], tip:'Полный отдых между подходами: важно качество.'},
 pistol:{name:'Присед на одной ноге к скамье', kind:'bw', step:1, sets:3, reps:[5,5], tip:'Повторы на каждую ногу. Опускайте скамью по мере прогресса, цель — пистолет.'},
 nordic:{name:'Скандинавские сгибания (Nordic curl)', kind:'bw', step:1, sets:3, reps:[4,6], tip:'Медленно опускайтесь, ноги держит партнёр или опора. Защищают колени.'},
 lsit:{name:'L-sit (уголок) на брусьях', kind:'time', step:5, sets:4, reps:[10,20], tip:'Начните с согнутых ног. Значение в секундах.'}

function cleanSession(s){
  if (!s || typeof s !== 'object') return null;
  var date = String(s.date || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  var type = TYPE_NAME[s.type] ? s.type : 'gym';
  var ex = [];
  (Array.isArray(s.ex) ? s.ex : []).forEach(function(e){
    if (!e || !e.id || !Array.isArray(e.sets)) return;
    var sets = e.sets.map(function(x){
      return {w:parseNum(x && x.w), r:Math.round(parseNum(x && x.r)), fb:(x && FB[x.fb]) ? x.fb : null};
    });
    if (sets.length) ex.push({id:String(e.id), name:e.name ? String(e.name).slice(0, 80) : undefined, kind:KIND_NAME[e.kind] ? e.kind : undefined, sets:sets});
  });
  return {id:String(s.id || uid()), date:date, type:type, prog:s.prog ? String(s.prog).slice(0, 40) : null, title:String(s.title || '').slice(0, 60),
          start:+s.start > 0 ? +s.start : 0, min:Math.round(parseNum(s.min)), rpe:clamp(Math.round(+s.rpe || 0), 0, 5),
          pain:(Array.isArray(s.pain) ? s.pain : []).map(function(p){ return String(p).slice(0, 30); }).slice(0, 6),
          note:String(s.note || '').slice(0, 1000), ex:ex};
}
function parseImport(text){
  try {
    var o = JSON.parse(text);
    var raw = Array.isArray(o) ? o : o.sessions;
    if (!Array.isArray(raw)) throw new Error('no sessions');
    var list = raw.map(cleanSession).filter(Boolean);
    var progs = Array.isArray(o.programs) ? o.programs.map(cleanProgram).filter(Boolean) : [];
    var cx = Array.isArray(o.customExercises) ? o.customExercises.map(cleanCustomEx).filter(Boolean) : [];
    ui.importDraft = {list:list, skipped:raw.length - list.length, programs:progs, customEx:cx};
  } catch (e) {
    ui.importDraft = null;
    toast('Не удалось прочитать JSON. Нужен файл, экспортированный из этого дневника.');
  }
  render();
}
function applyImport(mode){
  var d = ui.importDraft; if (!d) return;

    state.sessions = d.list.slice(); dirtyAll = true;

  } else {
    var have = {}; state.sessions.forEach(function(s){ have[s.id] = 1; });
    d.list.forEach(function(s){ if (!have[s.id]) { state.sessions.push(s); markDirty(s.date); } });
    var hc = {}; state.customEx.forEach(function(c){ hc[c.id] = 1; });
    d.customEx.forEach(function(c){ if (!hc[c.id]) state.customEx.push(c); });
    var hp = {}; state.programs.forEach(function(p){ hp[p.id] = 1; });
    d.programs.forEach(function(p){ if (!hp[p.id]) state.programs.push(p); });
  }
  state.programs.forEach(function(p){ p.items = p.items.filter(function(it){ return !!defOf(it.id); }); });
  ui.importDraft = null; ui.impText = ''; ui.edit = null;
  commit(); toast('Данные импортированы');
}

/* ---------- charts ---------- */
function lineChart(pts, unit){
  var W = 340, H = 170, L = 40, R = 16, T = 18, B = 26;
  var vals = pts.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), span = mx - mn;
  var lo = Math.max(0, Math.floor(mn - (span || 2) * 0.4)), hi = Math.ceil(mx + (span || 2) * 0.4);
  if (hi <= lo) hi = lo + 1;
  var n = pts.length;
  function xs(i){ return n === 1 ? L + (W - L - R) / 2 : L + (W - L - R) * i / (n - 1); }
  function ys(v){ return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Рабочий результат по тренировкам: от ' + fmt(vals[0]) + ' до ' + fmt(vals[n - 1]) + ' ' + unit + '">';
  [lo, (lo + hi) / 2, hi].forEach(function(t){
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(t).toFixed(1) + '" y2="' + ys(t).toFixed(1) + '"/>' +
         '<text x="' + (L - 6) + '" y="' + (ys(t) + 4).toFixed(1) + '" text-anchor="end">' + fmt(t) + '</text>';
  });
  var line = pts.map(function(p, i){ return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.v).toFixed(1); }).join(' ');
  if (n > 1) {
    s += '<path class="area" d="' + line + ' L' + xs(n - 1).toFixed(1) + ' ' + ys(lo).toFixed(1) + ' L' + xs(0).toFixed(1) + ' ' + ys(lo).toFixed(1) + ' Z"/>';
    s += '<path class="line" d="' + line + '"/>';
  }
  pts.forEach(function(p, i){
    var last = i === n - 1;
    s += '<circle class="pt' + (last ? ' last' : '') + '" cx="' + xs(i).toFixed(1) + '" cy="' + ys(p.v).toFixed(1) + '" r="' + (last ? 5 : 3) + '"/>';
  });
  s += '<text class="val" x="' + clamp(xs(n - 1), L + 14, W - R).toFixed(1) + '" y="' + (ys(vals[n - 1]) - 10).toFixed(1) + '" text-anchor="' + (n === 1 ? 'middle' : 'end') + '">' + fmt(vals[n - 1]) + '</text>';
  if (n === 1) s += '<text x="' + xs(0).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(pts[0].label) + '</text>';
  else s += '<text x="' + L + '" y="' + (H - 6) + '" text-anchor="start">' + esc(pts[0].label) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(pts[n - 1].label) + '</text>';
  return s + '</svg>';
}
function barChart(weeks){
  var W = 340, H = 170, L = 28, R = 10, T = 16, B = 26;
  var mx = GOAL;
  weeks.forEach(function(w){ var t = w.gym + w.volley + w.friends; if (t > mx) mx = t; });
  var step = mx <= 6 ? 1 : 2;
  var n = weeks.length, slot = (W - L - R) / n, bw = slot * 0.6;
  function ys(v){ return T + (H - T - B) * (1 - v / mx); }
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Занятия по неделям за последние ' + n + ' недель">';
  for (var t = 0; t <= mx; t += step) {
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(t).toFixed(1) + '" y2="' + ys(t).toFixed(1) + '"/>' +
         '<text x="' + (L - 6) + '" y="' + (ys(t) + 4).toFixed(1) + '" text-anchor="end">' + t + '</text>';
  }
  weeks.forEach(function(w, i){
    var x = L + slot * i + (slot - bw) / 2, base = 0;
    [['gym', w.gym], ['volley', w.volley], ['friends', w.friends]].forEach(function(p){
      if (!p[1]) return;
      var y1 = ys(base + p[1]), y0 = ys(base);
      s += '<rect class="b-' + p[0] + '" x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, y0 - y1 - 1).toFixed(1) + '"/>';
      base += p[1];
    });
    s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + ddmm(w.ws) + '</text>';
  });
  s += '<line class="goalline" x1="' + L + '" x2="' + (W - R) + '" y1="' + ys(GOAL).toFixed(1) + '" y2="' + ys(GOAL).toFixed(1) + '"/>';
  return s + '</svg>';
}

    case 'tab': ui.tab = v; ui.edit = null; ui.pick = null; ui.ask = null; window.scrollTo(0, 0); render(); break;
    case 'theme': setTheme(v); break;
    case 'prog': ui.prog = v; render(); break;
    case 'start': startWorkout(v); break;
    case 'startFree': startWorkout(null); break;
    case 'pstart': startWorkout(id); break;
    case 'ql': ui.ql = ui.ql === v ? null : v; ui.qlF = {day:null, dur:v === 'volley' ? 90 : 60, int:3, note:''}; render(); break;
    case 'qday': ui.qlF.day = v; render(); break;
    case 'qdur': ui.qlF.dur = parseInt(v, 10); ui.qlF.durCustom = false; render(); break;
    case 'qdurc': ui.qlF.durCustom = true; render(); break;
    case 'restCustom': ui.restCustom = true; render(); break;
    case 'qint': ui.qlF.int = parseInt(v, 10); render(); break;
    case 'qsave': saveQuick(); break;
    case 'qcancel': ui.ql = null; render(); break;
    case 'del': removeSession(id); break;
    case 'undo': undoLast(); break;
    case 'restLen': ui.restLen = parseInt(v, 10); ui.restCustom = false; saveRest(); render(); break;
    case 'warmToggle': ui.warmOpen = !ui.warmOpen; render(); break;
    case 'exToggle': ui.openEx = ui.openEx === v ? null : v; render(); break;
    case 'step': {
      var s = active.ex[i].sets[j], d = active.ex[i].d, k = el.getAttribute('data-k'), dir = parseInt(el.getAttribute('data-d'), 10);
      if (s.done) break;
      var amount = k === 'w' ? d.step : (d.kind === 'time' ? 5 : 1);
      s[k] = k === 'w' ? Math.max(0, Math.round((s.w + dir * amount) * 10) / 10) : Math.max(0, s.r + dir * amount);
      s.touched = true; saveActive(); render(); break;
    }
    case 'done': {
      var ex = active.ex[i], st = ex.sets[j];
      st.done = !st.done;
      if (st.done) {
        ui.rest = {end:Date.now() + ui.restLen * 1000, buzzed:false};
        var nx = nextUndone(ex, j);
        if (nx && !nx.touched && ex.d.kind === 'w') nx.w = st.w;
        if (!ex.sets.some(function(x){ return !x.done; })) { var n = nextOpenEx(); if (n) ui.openEx = n; }
      }
      saveActive(); render(); break;
    }
    case 'fb': {
      var ex2 = active.ex[i], st2 = ex2.sets[j];
      st2.fb = st2.fb === v ? null : v;
      var nx2 = nextUndone(ex2, j);
      if (nx2 && !nx2.touched) nx2.w = Math.max(0, Math.round((st2.w + (st2.fb === 'easy' ? ex2.d.step : st2.fb === 'hard' ? -ex2.d.step : 0)) * 10) / 10);
      saveActive(); render(); break;
    }
    case 'addSet': {
      var e3 = active.ex[i], lastS = e3.sets[e3.sets.length - 1];
      e3.sets.push({w:lastS.w, r:lastS.r, done:false, fb:null, touched:false});
      saveActive(); render(); break;
    }
    case 'wadd': ui.pick = ui.pick === 'work' ? null : 'work'; render(); break;
    case 'finish': ui.finishing = true; ui.discardAsk = false; ui.pick = null; window.scrollTo(0, 0); render(); break;
    case 'back': ui.finishing = false; ui.discardAsk = false; render(); break;
    case 'rpe': ui.fin.rpe = parseInt(v, 10); render(); break;
    case 'pain': {
      var pi = ui.fin.pain.indexOf(v);
      if (pi >= 0) ui.fin.pain.splice(pi, 1); else ui.fin.pain.push(v);
      render(); break;
    }
    case 'save': finishSession(); break;
    case 'discardAsk': ui.discardAsk = true; render(); break;
    case 'discardNo': ui.discardAsk = false; render(); break;
    case 'discardDo': active = null; saveActive(); releaseWake(); ui.finishing = false; ui.discardAsk = false; ui.rest = null; ui.tab = 'home'; ui.pick = null; render(); window.scrollTo(0, 0); toast('Тренировка удалена'); break;

    case 'pedit': ui.edit = id; ui.pick = null; ui.ask = null; window.scrollTo(0, 0); render(); break;
    case 'pback': ui.edit = null; ui.pick = null; ui.ask = null; render(); break;
    case 'pnewToggle': ui.newProg = !ui.newProg; render(); break;
    case 'pnewSave': {
      var title = (ui.np || '').trim();
      if (!title) { toast('Введите название программы'); break; }
      var np = {id:'p-' + uid(), title:title.slice(0, 60), rot:false, warm:WARM_GEN.slice(), items:[]};
      state.programs.push(np); ui.np = ''; ui.newProg = false; ui.edit = np.id; ui.pick = 'prog';
      commit(); window.scrollTo(0, 0); break;
    }
    case 'pdup': {
      var src = findProg(id); if (!src) break;
      var cp = JSON.parse(JSON.stringify(src));
      cp.id = 'p-' + uid(); cp.title = (src.title + ' (копия)').slice(0, 60); cp.rot = false;
      state.programs.push(cp); commit(); toast('Копия создана'); break;
    }
    case 'pstep': {
      var p1 = findProg(ui.edit); if (!p1 || !p1.items[i]) break;
      var it = p1.items[i], f = el.getAttribute('data-f'), dir2 = parseInt(el.getAttribute('data-d'), 10);
      var df = defOf(it.id), stp = df && df.kind === 'time' ? 5 : 1;
      if (f === 'sets') it.sets = clamp(it.sets + dir2, 1, 10);
      else if (f === 'lo') { it.lo = clamp(it.lo + dir2 * stp, 1, 999); if (it.hi < it.lo) it.hi = it.lo; }
      else if (f === 'hi') { it.hi = clamp(it.hi + dir2 * stp, 1, 999); if (it.lo > it.hi) it.lo = it.hi; }
      commit(); break;
    }
    case 'pup': case 'pdn': {
      var p2 = findProg(ui.edit); if (!p2) break;
      var tgt = a === 'pup' ? i - 1 : i + 1;
      if (tgt < 0 || tgt >= p2.items.length) break;
      var tmp = p2.items[i]; p2.items[i] = p2.items[tgt]; p2.items[tgt] = tmp;
      commit(); break;
    }
    case 'prm': {
      var p3 = findProg(ui.edit); if (!p3) break;
      p3.items.splice(i, 1); commit(); break;
    }
    case 'padd': ui.pick = ui.pick === 'prog' ? null : 'prog'; render(); break;
    case 'pickClose': ui.pick = ui.edit && !active ? null : null; ui.nxOpen = false; ui.exAsk = null; render(); break;
    case 'pickAdd': {
      var dd = defOf(id); if (!dd) break;
      pickInto(dd); commit(); break;
    }
    case 'nxToggle': ui.nxOpen = !ui.nxOpen; render(); break;
    case 'nxKind': ui.nx.kind = v; if (v !== 'w') ui.nx.step = DEF_BY_KIND[v].step; else ui.nx.step = 1; render(); break;
    case 'nxStep': ui.nx.step = parseFloat(v); render(); break;
    case 'nxSave': {
      var nd = createCustomEx(); if (!nd) break;
      pickInto(nd); commit(); break;
    }
    case 'exAsk': ui.exAsk = id; render(); break;
    case 'exNo': ui.exAsk = null; render(); break;
    case 'exDel': deleteCustomEx(ui.exAsk); ui.exAsk = null; commit(); toast('Упражнение удалено'); break;
    case 'pask': ui.ask = v; render(); break;
    case 'pno': ui.ask = null; render(); break;
    case 'pdo': {
      var p4 = findProg(ui.edit); if (!p4) break;
      if (v === 'del' && state.programs.length > 1) {
        state.programs = state.programs.filter(function(q){ return q.id !== p4.id; });
        if (ui.prog === p4.id) ui.prog = null;
        ui.edit = null; ui.ask = null; commit(); toast('Программа удалена');
      } else if (v === 'reset' && PROGS0[p4.id]) {
        var orig = defaultPrograms().filter(function(q){ return q.id === p4.id; })[0];
        var idx = state.programs.indexOf(p4); state.programs[idx] = orig;
        ui.ask = null; commit(); toast('Программа возвращена');
      }
      break;
    }

    case 'download': doDownload(); break;
    case 'copy': doCopy(); break;
    case 'rawToggle': ui.showRaw = !ui.showRaw; render(); break;
    case 'importCheck': parseImport(ui.impText || ''); break;
    case 'importMerge': applyImport('merge'); break;
    case 'importReplace': applyImport('replace'); break;
    case 'importCancel': ui.importDraft = null; render(); break;
    case 'resetAsk': ui.resetAsk = true; render(); break;
    case 'resetNo': ui.resetAsk = false; render(); break;
    case 'resetDo': resetAll(); break;
  }
});
document.addEventListener('input', function(ev){
  var t = ev.target, f = t.getAttribute && t.getAttribute('data-f'), inp = t.getAttribute && t.getAttribute('data-in');
  if (f === 'qlnote') ui.qlF.note = t.value;
  else if (f === 'finnote') ui.fin.note = t.value;
  else if (f === 'imp') ui.impText = t.value;
  else if (f === 'np') ui.np = t.value;
  else if (f === 'restc') { var rv = parseInt(t.value, 10); if (rv >= 5 && rv <= 3600) { ui.restLen = rv; saveRest(); } }
  else if (f === 'qldur') { var qv = parseInt(t.value, 10); if (qv >= 1 && qv <= 600) ui.qlF.dur = qv; }
  else if (f === 'nxname') ui.nx.name = t.value;
  else if (f === 'nxtip') ui.nx.tip = t.value;
  else if (f === 'ptitle') { var p = findProg(ui.edit); if (p) p.title = t.value.slice(0, 60); }
  else if (f === 'pwarm') {
    var p5 = findProg(ui.edit);
    if (p5) p5.warm = t.value.split('\n').map(function(x){ return x.trim().slice(0, 120); }).filter(Boolean).slice(0, 12);
  }
  else if (inp && active) {
    var i = intAttr(t, 'data-i'), j = intAttr(t, 'data-j'), s = active.ex[i] && active.ex[i].sets[j];
    if (!s) return;
    s[inp] = inp === 'w' ? parseNum(t.value) : Math.round(parseNum(t.value));
    s.touched = true; saveActive();
  }
});
document.addEventListener('change', function(ev){
  var t = ev.target, f = t.getAttribute && t.getAttribute('data-f');
  if (t.id === 'importFile' && t.files && t.files[0]) {
    var r = new FileReader();
    r.onload = function(){ ui.impText = String(r.result || ''); parseImport(ui.impText); };
    r.onerror = function(){ toast('Не удалось прочитать файл'); };
    r.readAsText(t.files[0]);
  } else if (t.getAttribute && t.getAttribute('data-sel') === 'pex') {
    ui.pex = t.value; render();
  } else if (t.getAttribute && t.hasAttribute('data-w') && active) {
    active.warm[intAttr(t, 'data-w')] = t.checked; saveActive(); render();
  } else if (t.getAttribute && t.hasAttribute('data-rot')) {
    var p = findProg(ui.edit); if (p) { p.rot = t.checked; commit(); }
  } else if (f === 'ptitle' || f === 'pwarm') {
    var p6 = findProg(ui.edit);
    if (p6 && f === 'ptitle' && !p6.title.trim()) p6.title = 'Программа';
    persist(); if (f === 'ptitle') render();
  }
});

if (!window.claude) {
  ui.hasDl = true;
  ui.dl = {save: function(o){ return new Promise(function(res, rej){ try {
    var blob = new Blob([o.data], {type:'application/json'}), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); res({status:'saved'});
  } catch (e) { rej({code:'unavailable'}); } }); }};
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
initTheme();
loadLocal();
render();
initRemote();
})();
</script>
